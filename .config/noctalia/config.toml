[audio]
enable_notification_sounds = false
enable_overdrive = true

[bar.default]
start = ["launcher", "workspaces", "tray"]
center = ["clock"]
end = ["cpu", "ram", "network", "bluetooth", "volume", "brightness", "battery", "notifications", "session"]
margin_ends = 0
radius = 0
widget_spacing = 14

[bar.default.dead_zone.actions]
middle = "theme-mode-toggle"

[brightness]
sync_all_monitors = true

[calendar]
enabled = true

[control_center.calendar]
show_events_card = false

[control_center.media]
show_visualizer = false

[desktop_widgets]
enabled = false

[location]
auto_locate = true

[lockscreen]
enabled = false

[nightlight]
enabled = true

[shell]
avatar_path = "~/.config/avatar"
clipboard_enabled = false
launch_apps_as_systemd_services = true
polkit_agent = true
show_close_buttons = false

[shell.launcher]
category_icons_only = true
layout = "simple"

[shell.panel]
launcher_placement = "attached"
launcher_position = "auto"
open_near_click_control_center = true
open_near_click_launcher = true
open_near_click_session = true
polkit_placement = "attached"

[[shell.session.actions]]
action = "command"
command = "loginctl lock-session"
glyph = "lock"
label = "Lock"
shortcut = "l"
variant = "default"

[[shell.session.actions]]
action = "command"
command = "systemctl suspend --check-inhibitors=no"
shortcut = "s"
glyph = "suspend"
label = "Suspend"
variant = "default"

[[shell.session.actions]]
action = "command"
command = "systemctl reboot --check-inhibitors=no"
shortcut = "r"
glyph = "reboot"
label = "Reboot"
variant = "default"

[[shell.session.actions]]
action = "command"
command = "systemctl poweroff --check-inhibitors=no"
shortcut = "p"
glyph = "shutdown"
label = "Power off"
variant = "destructive"

[theme]
community_palette = "Catppuccin Macchiato Mauve"
mode = "dark"
source = "community"

[wallpaper]
enabled = false

[widget.cpu]
visualization = "none"

[widget.launcher]
glyph = "niri"
scale = 1.5

[widget.launcher.actions]
middle = "exec niri msg action toggle-overview"

[widget.ram]
visualization = "none"

[widget.workspaces]
empty_color = "#85a6b0"
focused_color = "#85a6b0"
occupied_color = "#85a6b0"

[widget.workspaces.actions]
middle = "exec niri msg action toggle-overview"
